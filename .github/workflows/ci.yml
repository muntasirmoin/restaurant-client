name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Create .env for CI
        run: echo "VITE_BASE_URL=http://localhost:5000/api/v1" >> .env
      - name: Type check
        run: npx tsc -b
      - name: Build
        run: npm run build
